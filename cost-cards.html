<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cost Cards · Catan Companion</title>
  <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Crimson+Pro:ital,wght@0,400;0,500;0,600;0,700;1,500&display=swap" />
  <link rel="stylesheet" href="/src/styles/theme.css" />

<body>
  <div id="nav"></div>
  <main class="container">
    <header style="padding: 2rem 0 1rem">
      <h1>Cost Cards</h1>
      <p style="color: var(--color-text-muted); max-width: 40em">
        Quick reference for what everything costs. Toggle expansions to match what your
        group is playing with.
      </p>
    </header>

    <form class="expansion-toggles" id="expansion-toggles">
      <label><input type="checkbox" value="base" checked /> Base</label>
      <label><input type="checkbox" value="seafarers" checked /> Seafarers</label>
      <label><input type="checkbox" value="citiesKnights" checked /> Cities &amp; Knights</label>
    </form>

    <div id="cost-cards-root"></div>
  </main>
  <script type="module" src="/src/pages/costCards.ts"></script>
